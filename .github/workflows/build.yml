name: Сборка и публикация сайта

# Запускается после каждого коммита в main (в том числе после сохранений из CMS):
# пересобирает страницы и нарезки фото, коммитит изменения — GitHub Pages публикует сама.
# Также можно запустить вручную: вкладка Actions → «Сборка и публикация сайта» → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "pillow>=11.3"
      - run: python src/build.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Сборка сайта из исходников (Actions)'
      # Публикация на Cloudflare Pages: только собранные файлы, без исходников
      - name: Подготовка папки публикации
        run: |
          mkdir deploy
          find . -maxdepth 1 -name '*.html' -exec cp {} deploy/ \;
          cp -r assets admin content deploy/
      - name: Публикация на Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=star-comp --branch=main
