name: РЎР±РѕСЂРєР° Рё РїСѓР±Р»РёРєР°С†РёСЏ СЃР°Р№С‚Р°

# РЎР±РѕСЂРєР°: СЃР°Р№С‚ СЃРѕР±РёСЂР°РµС‚СЃСЏ РёР· src/ Рё content/ (РїСЂР°РІРєРё вЂ” РёР· Р°РґРјРёРЅРєРё Sveltia CMS
# РёР»Рё РЅР°РїСЂСЏРјСѓСЋ), РіРѕС‚РѕРІС‹Рµ С„Р°Р№Р»С‹ РїСѓР±Р»РёРєСѓСЋС‚СЃСЏ РЅР° GitHub Pages РЅР°РїСЂСЏРјСѓСЋ, Р±РµР·
# РєРѕРјРјРёС‚Р° РІ РІРµС‚РєСѓ main вЂ” СЌС‚Рѕ СѓР±РёСЂР°РµС‚ РєРѕРЅС„Р»РёРєС‚С‹ СЃР»РёСЏРЅРёСЏ РјРµР¶РґСѓ РєРѕРјРїСЊСЋС‚РµСЂР°РјРё.
# РЎРЅР°С‡Р°Р»Р° РѕР±РЅРѕРІР»СЏРµС‚СЃСЏ С‚РµСЃС‚РѕРІР°СЏ РІРµСЂСЃРёСЏ РЅР° GitHub Pages, Р·Р°С‚РµРј С‚РѕС‚ Р¶Рµ СЃР°Р№С‚
# Р·Р°Р»РёРІР°РµС‚СЃСЏ РЅР° Р±РѕРµРІРѕР№ С…РѕСЃС‚РёРЅРі reg.ru РїРѕ SFTP.
# Р—Р°РїСѓСЃС‚РёС‚СЊ РІСЂСѓС‡РЅСѓСЋ РјРѕР¶РЅРѕ Рё Р±РµР· РїСЂР°РІРѕРє: РІРєР»Р°РґРєР° Actions в†’ Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Р—Р°РєР°Р·С‹ РЅРµ РѕС‚РјРµРЅСЏРµРј: Р·Р°Р»РёРІРєР° РЅР° reg.ru РґРѕР»Р¶РЅР° РІСЃРµРіРґР° РґРѕС…РѕРґРёС‚СЊ РґРѕ РєРѕРЅС†Р°.
# Р•СЃР»Рё Р·Р° РєРѕСЂРѕС‚РєРѕРµ РІСЂРµРјСЏ РїСЂРёС€Р»Рѕ РЅРµСЃРєРѕР»СЊРєРѕ РїСЂР°РІРѕРє, РѕРЅРё РІСЃС‚Р°СЋС‚ РІ РѕС‡РµСЂРµРґСЊ.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "pillow>=11.3"
      # РєСЌС€ РЅР°СЂРµР·Р°РЅРЅС‹С… С„РѕС‚Рѕ: Р±РµР· РЅРµРіРѕ РєР°Р¶РґР°СЏ СЃР±РѕСЂРєР° РїРµСЂРµСЃРѕР·РґР°С‘С‚ РІСЃРµ РєР°СЂС‚РёРЅРєРё Р·Р°РЅРѕРІРѕ (~10 РјРёРЅСѓС‚)
      - uses: actions/cache@v4
        with:
          path: assets
          key: assets-${{ hashFiles('content/photos/**', 'src/build.py', 'content/builds/**', 'content/cards.json', 'content/stock.json') }}
          restore-keys: assets-
      - run: python src/rename_photos.py
      - run: python src/build.py
      # РїРµСЂРµРёРјРµРЅРѕРІР°РЅРЅС‹Рµ С„РѕС‚Рѕ Рё РѕР±РЅРѕРІР»С‘РЅРЅС‹Рµ СЃСЃС‹Р»РєРё РєРѕРјРјРёС‚РёРј РѕР±СЂР°С‚РЅРѕ РІ СЂРµРїРѕР·РёС‚РѕСЂРёР№
      # (С‚РѕР»СЊРєРѕ content/ вЂ” РіРѕС‚РѕРІС‹Р№ СЃР°Р№С‚ РІ СЂРµРїРѕР·РёС‚РѕСЂРёР№ Р±РѕР»СЊС€Рµ РЅРµ РїРёС€РµС‚СЃСЏ)
      # РџРµСЂРµРёРјРµРЅРѕРІР°РЅРёСЏ С„РѕС‚Рѕ РєРѕРјРјРёС‚РёРј РІСЂСѓС‡РЅСѓСЋ, СЃ СЂРµР±РµР№Р·РѕРј Рё РїРѕРІС‚РѕСЂР°РјРё: РїРѕРєР° РёРґС‘С‚
      # СЃР±РѕСЂРєР° (5-10 РјРёРЅСѓС‚), РІР»Р°РґРµР»РµС† РјРѕР¶РµС‚ СѓСЃРїРµС‚СЊ Р·Р°РіСЂСѓР·РёС‚СЊ РЅРѕРІС‹Рµ С„РѕС‚Рѕ РёР· Р°РґРјРёРЅРєРё,
      # Рё РѕР±С‹С‡РЅС‹Р№ push РїР°РґР°РµС‚ (non-fast-forward) вЂ” СЌС‚Рѕ Рё Р±С‹Р»Рё РѕС€РёР±РєРё РІ Actions.
      - name: РљРѕРјРјРёС‚ РїРµСЂРµРёРјРµРЅРѕРІР°РЅРёР№ С„РѕС‚Рѕ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "РџРµСЂРµРёРјРµРЅРѕРІР°РЅРёР№ РЅРµС‚ - РєРѕРјРјРёС‚ РЅРµ РЅСѓР¶РµРЅ"
          else
            git commit -m "РЎР±РѕСЂРєР°: С„РѕС‚Рѕ РїСЂРёРІРµРґРµРЅС‹ Рє РµРґРёРЅРѕРјСѓ РёРјРµРЅРѕРІР°РЅРёСЋ [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin main; then ok=1; break; fi
              echo "РџСѓС€ РЅРµ РїСЂРѕС€С‘Р» (РїРѕРїС‹С‚РєР° $i), Р¶РґСѓ Рё РїСЂРѕР±СѓСЋ РµС‰С‘ СЂР°Р· РїРѕСЃР»Рµ СЂРµР±РµР№Р·Р°"
              sleep 15
            done
            [ "$ok" = 1 ] || { echo "РќРµ СѓРґР°Р»РѕСЃСЊ Р·Р°РїСѓС€РёС‚СЊ РїРµСЂРµРёРјРµРЅРѕРІР°РЅРёСЏ РїРѕСЃР»Рµ 3 РїРѕРїС‹С‚РѕРє"; exit 1; }
          fi
      # РЅР° Pages РёРґСѓС‚: РіРѕС‚РѕРІС‹Р№ СЃР°Р№С‚ + Р°РґРјРёРЅРєР°; РёСЃС…РѕРґРЅРёРєРё Рё .git РЅРµ РїСѓР±Р»РёРєСѓСЋС‚СЃСЏ
      - run: |
          mkdir -p _site
          cp -r *.html robots.txt sitemap.xml assets admin .preview .nojekyll _site/
      # РЅР° reg.ru РёРґС‘С‚ С‚РѕР»СЊРєРѕ СЃР°Р№С‚: Р±РµР· Р°РґРјРёРЅРєРё Рё РїР°РїРєРё РїСЂРµРІСЊСЋ
      - run: |
          mkdir -p _reg
          cp -r *.html robots.txt sitemap.xml .htaccess assets _reg/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: reg-site
          path: _reg
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy_reg:
    # СЃРЅР°С‡Р°Р»Р° РѕР±РЅРѕРІР»СЏРµРј С‚РµСЃС‚РѕРІСѓСЋ РІРµСЂСЃРёСЋ РЅР° GitHub Pages, Рё С‚РѕР»СЊРєРѕ РїРѕС‚РѕРј вЂ” Р±РѕР№
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reg-site
          path: _reg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install paramiko
      - name: Р—Р°Р»РёРІРєР° РЅР° reg.ru РїРѕ SFTP
        env:
          REG_SFTP_SERVER: ${{ secrets.REG_SFTP_SERVER }}
          REG_SFTP_PORT: ${{ secrets.REG_SFTP_PORT }}
          REG_SFTP_USERNAME: ${{ secrets.REG_SFTP_USERNAME }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
          REG_SFTP_DIR: ${{ secrets.REG_SFTP_DIR }}
        run: python src/deploy_reg.py _reg
