name: Сборка и публикация сайта

# Сборка: сайт собирается из src/ и content/ (правки — из админки Sveltia CMS
# или напрямую), готовые файлы публикуются на GitHub Pages напрямую, без
# коммита в ветку main — это убирает конфликты слияния между компьютерами.
# Сначала обновляется тестовая версия на GitHub Pages, затем тот же сайт
# заливается на боевой хостинг reg.ru по SFTP.
# Запустить вручную можно и без правок: вкладка Actions → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Заказы не отменяем: заливка на reg.ru должна всегда доходить до конца.
# Если за короткое время пришло несколько правок, они встают в очередь.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "pillow>=11.3"
      # кэш нарезанных фото: без него каждая сборка пересоздаёт все картинки заново (~10 минут)
      - uses: actions/cache@v4
        with:
          path: assets
          key: assets-${{ hashFiles('content/photos/**', 'src/build.py', 'content/builds/**', 'content/cards.json', 'content/stock.json') }}
          restore-keys: assets-
      - run: python src/rename_photos.py
      - run: python src/build.py
      # переименованные фото и обновлённые ссылки коммитим обратно в репозиторий
      # (только content/ — готовый сайт в репозиторий больше не пишется)
      # Переименования фото коммитим вручную, с ребейзом и повторами: пока идёт
      # сборка (5-10 минут), владелец может успеть загрузить новые фото из админки,
      # и обычный push падает (non-fast-forward) — это и были ошибки в Actions.
      - name: Коммит переименований фото
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "Переименований нет - коммит не нужен"
          else
            git commit -m "Сборка: фото приведены к единому именованию [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then ok=1; break; fi
              echo "Пуш не прошёл (попытка $i), жду и пробую ещё раз после ребейза"
              sleep 15
            done
            [ "$ok" = 1 ] || { echo "Не удалось запушить переименования после 3 попыток"; exit 1; }
          fi
      # на Pages идут: готовый сайт + админка; исходники и .git не публикуются
      - run: |
          mkdir -p _site
          cp -r *.html robots.txt sitemap.xml assets admin .preview .nojekyll _site/
      # на reg.ru идёт только сайт: без админки и папки превью
      - run: |
          mkdir -p _reg
          cp -r *.html robots.txt sitemap.xml .htaccess assets _reg/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: reg-site
          path: _reg
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy_reg:
    # сначала обновляем тестовую версию на GitHub Pages, и только потом — бой
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reg-site
          path: _reg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install paramiko
      - name: Заливка на reg.ru по SFTP
        env:
          REG_SFTP_SERVER: ${{ secrets.REG_SFTP_SERVER }}
          REG_SFTP_PORT: ${{ secrets.REG_SFTP_PORT }}
          REG_SFTP_USERNAME: ${{ secrets.REG_SFTP_USERNAME }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
          REG_SFTP_DIR: ${{ secrets.REG_SFTP_DIR }}
        run: python src/deploy_reg.py _reg
