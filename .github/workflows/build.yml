name: Сборка и публикация сайта

# Сборка: сайт собирается из src/ и content/ (правки — из админки Sveltia CMS
# или напрямую), готовые файлы публикуются на GitHub Pages напрямую, без
# коммита в ветку main — это убирает конфликты слияния между компьютерами.
# Запустить вручную можно и без правок: вкладка Actions → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# одновременные сборки не нужны: новая отменяет старую
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "pillow>=11.3"
      - run: python src/rename_photos.py
      - run: python src/build.py
      # на Pages идут: готовый сайт + админка; исходники и .git не публикуются
      - uses: actions/upload-pages-artifact@v3
        with:
          path: |
            *.html
            robots.txt
            sitemap.xml
            assets
            admin
            .preview
            .nojekyll
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
