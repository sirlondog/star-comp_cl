name: Сборка и публикация сайта

# Запускается после каждого коммита в main (в том числе после сохранений из CMS):
# переименовывает фото в <слаг папки>_<номер>, пересобирает страницы и нарезки фото,
# коммитит изменения — GitHub Pages публикует сама.
# Также можно запустить вручную: вкладка Actions → «Сборка и публикация сайта» → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "pillow>=11.3"
      - run: python src/rename_photos.py
      - run: python src/build.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Сборка сайта из исходников (Actions)'
      # Публикация: GitHub Pages отдаёт содержимое репозитория само,
      # отдельный шаг деплоя не нужен.
