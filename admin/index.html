<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>STAR-COMP — управление сайтом</title>
</head>
<body>
<!-- Админка Sveltia CMS. Настройки полей — в config.yml рядом. Сама админка лежит здесь же (версия 0.265.1); с внешних серверов подгружается только русский перевод интерфейса. -->
<script src="sveltia-cms.js"></script>
<!-- Своё поле: фото с точкой фокуса (кадрирование вручную). Регистрируется сразу после ядра CMS. -->
<script src="custom-fields.js"></script>
<!-- Кнопка «Дублировать» в коллекции «Страницы сборок»: копирует выбранные галочками
     страницы через GitHub и сразу открывает копию на редактирование. -->
<script src="duplicate.js"></script>
<!-- Предупреждение о дублях в «Базе железа»: красная плашка, если модель уже есть. -->
<script src="hardware-guard.js"></script>
<!-- Предупреждение о дублях папок картинок: красная плашка в «Ресурсах». -->
<script src="media-guard.js"></script>
</body>
</html>
