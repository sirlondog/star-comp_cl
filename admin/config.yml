# Настройки админки (Sveltia CMS). Открывается по адресу /admin/ на сайте.
# Вход — по личному токену GitHub (кнопка «Войти с токеном»).
backend:
  name: github
  repo: sirlondog/star-comp_cl
  branch: main
  auth_methods: [token]
  commit_messages:
    create: 'Админка: добавлена страница «{{slug}}»'
    update: 'Админка: изменена страница «{{slug}}»'
    delete: 'Админка: удалена страница «{{slug}}»'
    uploadMedia: 'Админка: загружен файл {{path}}'
    deleteMedia: 'Админка: удалён файл {{path}}'

site_url: https://star-comp.ru
app_title: STAR-COMP — управление сайтом
locale: ru

# Куда складываются загруженные фото (исходники; нужные размеры сайт нарезает сам)
media_folder: content/photos
public_folder: /content/photos
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 2560
          height: 2560

# Одиночные страницы: показываются одной группой в сайдбаре, клик открывает редактор сразу
singletons:
  - name: contacts
    label: Блок контактов (футер)
    icon: contact_mail
    description: 'Нижний блок «Личная консультация» на всех страницах: здесь только фото мастерской, остальные данные — из «Настроек сайта»'
    file: content/contacts.json
    format: json
    fields:
      - name: photos
        label: Фото мастерской
        label_singular: фото
        widget: list
        max: 3
        required: false
        summary: '{{image}}'
        hint: 'До трёх вертикальных фото 9:16. Если пусто — на сайте будут пустые блоки-заглушки'
        fields:
          - name: image
            label: Фото
            widget: image

  - name: menu
    label: Боковое меню
    icon: menu
    description: Пункты меню, которое открывается по кнопке с полосками в шапке. Показывается и на главной, и на страницах сборок
    file: content/menu.json
    format: json
    fields:
      - name: links
        label: Пункты
        label_singular: пункт
        widget: list
        min: 1
        add_to_top: false
        summary: '{{label}} → {{url}}'
        hint: 'Порядок в списке = порядок в меню. Кнопками вверх/вниз меняются местами, крестиком удаляются'
        fields:
          - name: label
            label: Название пункта
            widget: string
            hint: 'Например: Отзывы'
          - name: url
            label: Куда ведёт
            widget: string
            hint: 'Якорь на главной со решёткой (#otzivy) или адрес страницы (remont-kompyuterov-spb.html). На страницах сборок якоря автоматически ведут на главную'

  - name: faq
    label: Вопросы и ответы (FAQ)
    icon: help_outline
    description: 'Блок «Остались вопросы?» внизу главной: меняйте вопросы и ответы, добавляйте и удаляйте пункты. После сохранения сайт пересоберётся сам'
    file: content/faq.json
    format: json
    fields:
      - name: title
        label: Заголовок
        widget: string
        hint: 'Например: Остались вопросы?'
      - name: lead
        label: Текст под заголовком
        widget: text
        required: false
      - name: button
        label: Надпись на кнопке
        widget: string
        hint: 'Кнопка ведёт к чату/форме обратной связи на сайте'
      - name: items
        label: Вопросы и ответы
        label_singular: вопрос
        widget: list
        add_to_top: false
        collapsed: true
        min: 0
        summary: '{{question}}'
        hint: 'Порядок в списке = порядок на сайте. Кнопками вверх/вниз меняются местами, крестиком удаляются. Первый вопрос открыт по умолчанию'
        fields:
          - name: question
            label: Вопрос
            widget: string
            hint: 'Например: За сколько дней соберёте компьютер?'
          - name: answer
            label: Ответ
            widget: text
            hint: 'Можно несколько абзацев — разделяйте их пустой строкой'

  - name: codes
    label: Коды и счётчики
    icon: code
    description: Код для сторонних сервисов (Яндекс Метрика, Top.Mail.Ru, чаты). Вставляется на все страницы сайта сразу. После сохранения сайт пересоберётся сам
    file: content/codes.json
    format: json
    fields:
      - name: head_code
        label: Код в <head> (служебная часть страницы)
        widget: code
        output_code_only: true
        required: false
        hint: 'То, что сервис просит вставить «в тег head». Обычно это метатеги и favicon-коды. Оставьте пустым, если ничего не нужно'
      - name: body_code
        label: Код перед </body> (конец страницы)
        widget: code
        output_code_only: true
        required: false
        hint: 'То, что сервис просит вставить «перед закрывающим body». Обычно сюда ставят Яндекс Метрику, Top.Mail.Ru и онлайн-чаты. Оставьте пустым, если ничего не нужно'

collections:
  - name: hardware
    label: База железа
    label_singular: позицию
    icon: memory
    description: База комплектующих. Заполняется один раз, дальше модели выбираются в сборках из списка.
    folder: content/hardware
    format: json
    extension: json
    create: true
    identifier_field: model
    slug: '{{fields.model}}'
    sortable_fields: [type, model]
    editor:
      preview: false
    fields:
      - name: type
        label: Категория
        widget: select
        options: [Процессор, Видеокарта, Материнская плата, Оперативная память, Накопитель, Блок питания, Охлаждение, Корпус]
        hint: 'Категория детали. Если нужной нет в списке — скажите, добавим'
      - name: model
        label: Модель
        widget: string
        hint: 'Бренд и модель как должны выглядеть на странице: NVIDIA RTX 5060 8GB GIGABYTE WINDFORCE'

  - name: cards
    label: Блоки на главной
    icon: computer
    description: Два блока на главной — «Последние проекты нашей мастерской» и «Компьютеры в наличии»
    files:
      - name: cards
        label: Последние проекты
        file: content/cards.json
        format: json
        fields:
          - name: cards
            label: Карточки
            label_singular: карточку
            widget: list
            collapsed: true
            min: 1
            add_to_top: false
            summary: '{{name}} — от {{price_from}} ₽'
            hint: 'Порядок в списке = порядок на странице. Кнопками вверх/вниз можно менять карточки местами'
            fields: &card_fields
              - name: name
                label: Название
                widget: string
                hint: 'Например: NOVA X1'
              - name: image
                label: Фото
                widget: imageFocal
                hint: 'Выбери файл, кликни по фото — туда встанет центр кадра, ползунком «Увеличение» приблизь. Голубая рамка и кадр снизу показывают, что будет на карточке. Значение хранится как {path, x, y, zoom}'
              - name: alt
                label: Что на фото
                widget: string
                hint: 'Коротко: «компьютер в чёрном корпусе с деревянной панелью». Нужно поисковикам и незрячим'
              - name: specs
                label: Комплектующие
                widget: object
                hint: 'Процессор — из «Базы железа» (только процессоры), видеокарта — вручную'
                fields:
                  - name: cpu
                    label: Процессор
                    widget: relation
                    collection: hardware
                    value_field: model
                    display_fields: [model, type]
                    search_fields: [model, type]
                    filters:
                      - field: type
                        values: [Процессор]
                    required: false
                    hint: 'Выбор из «Базы железа» — в списке только процессоры'
                  - name: gpu
                    label: Видеокарта
                    widget: string
                    hint: 'Вписывается вручную: NVIDIA RTX 5060 Ti 8GB …'
              - name: price_from
                label: Цена от, ₽
                widget: number
                value_type: int
                min: 0
                hint: 'Только число, без пробелов: 99800'
              - name: show_from
                label: Пометка «от» перед ценой
                widget: boolean
                required: false
                default: true
                hint: 'Включено — на карточке «от 99 800 ₽» (цена может вырасти). Выключено — просто «99 800 ₽» (фиксированная цена)'
              - name: discount_enabled
                label: Включить скидку
                widget: boolean
                required: false
                default: false
                hint: 'Включите, чтобы показать на карточке красную пилюлю со скидкой и зачёркнутую старую цену'
              - name: old_price
                label: Старая цена, ₽
                widget: number
                value_type: int
                min: 0
                required: false
                hint: 'Старая цена до скидки. Показывается зачёркнутой рядом с текущей ценой'
              - name: discount_percent
                label: Скидка, %
                widget: number
                value_type: int
                min: 1
                max: 99
                required: false
                hint: 'Процент скидки N для пилюли «Скидка N% до ...». Если не указать, посчитается от старой и текущей цены'
              - name: discount_until
                label: Дата завершения акции
                widget: string
                required: false
                default: '01.12.2026'
                hint: 'Дата окончания скидки, показывается в пилюле: «Скидка N% до ДД.ММ.ГГГГ»'
              - name: page
                label: Ссылка на страницу сборки
                widget: string
                required: false
                hint: 'Имя файла страницы, например solar-s1-....html. Если пусто, карточка ведёт на блок подбора на главной'
              - name: extra
                label: Скрывать до нажатия «Показать ещё»
                widget: boolean
                required: false
                default: false

      - name: stock
        label: Компьютеры в наличии
        file: content/stock.json
        format: json
        fields:
          - name: hidden
            label: Скрыть блок
            widget: boolean
            default: true
            hint: 'Ползунок «Скрыть»: включён — блока нет на главной. Добавите работы в список ниже — выключите ползунок, и блок появится под «Последними проектами»'
          - name: title
            label: Заголовок блока
            widget: string
            hint: 'Например: Компьютеры в наличии'
          - name: lead
            label: Описание над карточками
            widget: text
            required: false
            hint: 'Одна строка под заголовком. Пусто = без описания'
          - name: cards
            label: Карточки
            label_singular: карточку
            widget: list
            add_to_top: false
            collapsed: true
            required: false
            summary: '{{name}} — от {{price_from}} ₽'
            hint: 'Порядок в списке = порядок на странице. Кнопками вверх/вниз можно менять карточки местами'
            fields: *card_fields

  - name: builds
    label: Страницы сборок
    label_singular: сборку
    icon: desktop_windows
    description: Страницы компьютеров. Одна запись — одна страница сайта.
    folder: content/builds
    format: json
    extension: json
    create: true
    identifier_field: name
    slug: '{{fields.slug}}'
    summary: '{{name}} — {{price}} ₽'
    sortable_fields: [name, price]
    editor:
      preview: false
    fields:
      - name: name
        label: Название
        widget: string
        hint: 'Крупный заголовок страницы. Например: SOLAR S1'
      - name: subtitle
        label: Строка под названием
        widget: string
        required: false
        hint: 'Продолжение заголовка, читается поисковиком как одно целое с названием. Например: игровой компьютер на процессоре INTEL CORE i5-12400F и NVIDIA RTX 5050'
      - name: slug
        label: Адрес страницы
        widget: string
        pattern: ['^[a-z0-9][a-z0-9-]*$', 'Только латинские строчные буквы, цифры и дефис']
        hint: 'Часть адреса после star-comp.ru/. Для страниц со старого сайта — точно как было, иначе страница потеряет позиции в поиске. После публикации не менять.'
      - name: price
        label: Цена, ₽ (fallback)
        widget: number
        value_type: int
        min: 0
        hint: 'Используется только если у этой сборки нет карточки в «Блоки на главной». Основная цена/скидка задаётся в карточке блока.'
      - name: note
        label: Текст рядом с кнопкой
        widget: text
        required: false
        default: 'Собран, настроен и протестирован. Можно изменить или дополнить конфигурацию. Забирайте сегодня или закажите доставку с подключением.'
        hint: 'Два-три коротких предложения: что с компьютером и как его получить'
      - name: photos
        label: Фотографии
        label_singular: фото
        widget: list
        min: 1
        summary: '{{alt}}'
        hint: 'Первое фото — главное: корпус целиком. Лучше горизонтальные 4:3, остальное сайт обрежет по центру.'
        fields:
          - name: image
            label: Фото
            widget: image
          - name: alt
            label: Что на фото
            widget: string
            hint: 'Коротко, без названия сборки: «видеокарта крупным планом». Нужно поисковикам и незрячим.'
      - name: video
        label: Видео (Kinescope)
        widget: object
        required: false
        collapsed: true
        hint: 'Если видео нет — оставьте пустым, блок на странице не появится. Обложка делается из первого кадра автоматически'
        fields:
          - name: horizontal
            label: Код горизонтального видео
            widget: string
            required: false
            hint: 'Буквы и цифры из ссылки kinescope.io/… — показывается на компьютере'
          - name: vertical
            label: Код вертикального видео
            widget: string
            required: false
            hint: 'Показывается на телефоне. Если его нет, будет горизонтальное'
      - name: lead
        label: Описание сборки
        widget: text
        required: false
        hint: 'Одно-три предложения: для чего этот компьютер. Стоит под заголовком «Конфигурация»'
      - name: about
        label: Текст о сборке
        widget: text
        required: false
        hint: 'Абзац после описания сборки: на каких настройках идёт, кому подойдёт. Разворачивается на всю ширину'
      - name: specs
        label: Комплектующие
        widget: object
        collapsed: false
        hint: 'Заполняйте только нужные строки. В каждом поле — выбор из «Базы железа» нужной категории (например, в «Процессоре» — только процессоры). Модель нет в базе — сначала добавьте её там'
        fields:
          - name: cpu
            label: Процессор
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Процессор]
            required: false
          - name: gpu
            label: Видеокарта
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Видеокарта]
            required: false
          - name: motherboard
            label: Материнская плата
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Материнская плата]
            required: false
          - name: ram
            label: Оперативная память
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Оперативная память]
            required: false
          - name: storage
            label: Накопитель
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Накопитель]
            required: false
          - name: psu
            label: Блок питания
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Блок питания]
            required: false
          - name: cooling
            label: Охлаждение
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Охлаждение]
            required: false
          - name: case
            label: Корпус
            widget: relation
            collection: hardware
            value_field: model
            display_fields: [model, type]
            search_fields: [model, type]
            filters:
              - field: type
                values: [Корпус]
            required: false
      - name: seo
        label: Для поисковиков
        widget: object
        required: false
        collapsed: true
        fields:
          - name: title
            label: Title — название вкладки и заголовок в поиске
            widget: string
            required: false
            hint: 'До 70 знаков. Если пусто — соберётся из названия и строки под ним'
          - name: description
            label: Description — описание в поиске
            widget: text
            required: false
            hint: '150–200 знаков: комплектующие, цена, город, чем удобно'
