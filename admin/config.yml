# Настройки админки (Sveltia CMS). Открывается по адресу /admin/ на сайте.
# Вход — по личному токену GitHub (кнопка «Войти с токеном»).
backend:
  name: github
  repo: sirlondog/star-comp_cl
  branch: main
  auth_methods: [token]
  commit_messages:
    create: 'Админка: добавлена страница «{{slug}}»'
    update: 'Админка: изменена страница «{{slug}}»'
    delete: 'Админка: удалена страница «{{slug}}»'
    uploadMedia: 'Админка: загружен файл {{path}}'
    deleteMedia: 'Админка: удалён файл {{path}}'

site_url: https://star-comp.ru
app_title: STAR-COMP — управление сайтом
locale: ru

# Куда складываются загруженные фото (исходники; нужные размеры сайт нарезает сам)
media_folder: content/photos
public_folder: /content/photos
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 90
          width: 2560
          height: 2560

# Одиночные страницы: показываются одной группой в сайдбаре, клик открывает редактор сразу
singletons:
  - name: settings
    label: Настройки сайта
    icon: settings
    description: Контакты, соцсети и цифры рейтинга. Эти данные показываются в шапке, меню и под фото на главной, а поисковики видят их в служебной разметке
    file: content/settings.json
    format: json
    fields:
      - name: phone_display
        label: Телефон (как показывать)
        widget: string
        hint: 'Вид на сайте, например: 8 (993) 984-55-05'
      - name: phone_tel
        label: Телефон (ссылка набора)
        widget: string
        pattern: ['^\+?[0-9]{10,15}$', 'Только цифры, можно с плюсом в начале']
        hint: 'То же число без пробелов и скобок: +79939845505. По нему звонят при клике'
      - name: phone_schema
        label: Телефон для поисковиков
        widget: string
        hint: 'Для поисковой разметки, например: +7-993-984-55-05'
      - name: phone_note
        label: Подпись под телефоном
        widget: string
        hint: 'Например: Без выходных, 11:00 до 19:00'
      - name: menu_note
        label: Расписание в меню
        widget: string
        hint: 'Строка под телефоном в мобильном меню, например: Пн-Вс, 11:00 до 19:00'
      - name: schedule
        label: Часы работы (на главной)
        widget: string
        hint: 'Например: Ежедневно, 11:00–19:00'
      - name: email
        label: Почта
        widget: string
      - name: address
        label: Адрес (короткий, на главной)
        widget: string
        hint: 'Например: Заневский 65к5, ст. м. Ладожская'
      - name: address_full
        label: Адрес (полный, для поисковиков)
        widget: string
        hint: 'Например: Заневский пр., 65 к5, 2 этаж'
      - name: opening_hours_schema
        label: Часы работы для поисковиков
        widget: string
        hint: 'Формат: Mo-Su 11:00-19:00 (дни и время по международному стандарту)'
      - name: socials
        label: Соцсети
        widget: object
        fields:
          - name: max
            label: Макс (MAX messenger)
            widget: string
            required: false
          - name: telegram
            label: Telegram
            widget: string
            required: false
          - name: vk
            label: ВКонтакте
            widget: string
            required: false
        hint: 'Полные ссылки на группы. Пустое поле = значок не показывается'
      - name: stats
        label: Цифры на главной
        widget: object
        fields:
          - name: rating
            label: Рейтинг
            widget: string
            hint: 'Например: 5/5*'
          - name: reviews
            label: Отзывов
            widget: string
            hint: 'Например: 120+'
          - name: experience
            label: Лет опыта
            widget: string
            hint: 'Например: 16+'
          - name: maps_url
            label: Ссылка на отзывы Яндекс Карт
            widget: string
            required: false
          - name: maps_note
            label: Пояснение к рейтингу
            widget: string
            required: false
            hint: 'Например: *оценка организации на (слова «Яндекс картах» добавятся сами, как ссылка)'

  - name: home
    label: Главная страница
    icon: home
    description: Тексты первого экрана и заголовков главной
    file: content/home.json
    format: json
    fields:
      - name: badge
        label: Бейдж над заголовком
        widget: string
        hint: 'Например: Профессиональная сборка'
      - name: title_before
        label: Заголовок (начало)
        widget: string
        hint: 'Начало заголовка до выделенного слова, например: Компьютер на заказ с'
      - name: title_accent
        label: Заголовок (выделенное слово)
        widget: string
        required: false
        hint: 'Показывается цветным, например: гарантией. Пусто = без выделения'
      - name: title_after
        label: Заголовок (окончание)
        widget: string
        hint: 'Например: и запасом на 5 лет'
      - name: lead
        label: Подзаголовок
        widget: text
        hint: 'Одна строка под заголовком, например: Привезём, подключим и настроим у вас дома — оплата после проверки'
      - name: button
        label: Текст кнопки
        widget: string
        hint: 'Например: Подобрать компьютер'
      - name: hero_caption
        label: Подпись под фото
        widget: string
        hint: 'Например: Приезжайте посмотреть, как проходит сборка'
      - name: hero_alt
        label: Что на фото (для поисковиков)
        widget: string
        hint: 'Короткое описание фото первого экрана'
      - name: hero_image
        label: Своё фото первого экрана
        widget: image
        required: false
        hint: 'Загрузи своё фото — сайт сам нарежет нужные размеры. Пусто = стандартное фото'
      - name: cards_title
        label: Заголовок над карточками
        widget: string
        hint: 'Например: Последние проекты нашей'
      - name: cards_title_accent
        label: Заголовок над карточками (выделенное слово)
        widget: string
        required: false
        hint: 'Показывается цветным, например: мастерской. Пусто = без выделения'
      - name: cards_lead
        label: Описание над карточками
        widget: text
        hint: 'Например: Аккуратная сборка и внимание к каждой детали'

  - name: perks
    label: Наши преимущества
    icon: workspace_premium
    description: Три (или сколько нужно) плитки под первым экраном главной
    file: content/perks.json
    format: json
    fields:
      - name: perks
        label: Плитки
        label_singular: плитку
        widget: list
        min: 1
        summary: '{{title}}'
        hint: 'Порядок в списке = порядок на странице'
        fields:
          - name: icon
            label: Значок
            widget: select
            options: [no-extra, warranty, price]
            hint: 'no-extra — шестерёнка без переплат, warranty — щит с галочкой, price — прайс'
          - name: title
            label: Заголовок
            widget: string
            hint: 'Например: Честная цена'
          - name: text
            label: Описание
            widget: text
            hint: 'Одно короткое предложение'

  - name: menu
    label: Боковое меню
    icon: menu
    description: Пункты меню, которое открывается по кнопке с полосками в шапке. Показывается и на главной, и на страницах сборок
    file: content/menu.json
    format: json
    fields:
      - name: links
        label: Пункты
        label_singular: пункт
        widget: list
        min: 1
        add_to_top: false
        summary: '{{label}} → {{url}}'
        hint: 'Порядок в списке = порядок в меню. Кнопками вверх/вниз меняются местами, крестиком удаляются'
        fields:
          - name: label
            label: Название пункта
            widget: string
            hint: 'Например: Отзывы'
          - name: url
            label: Куда ведёт
            widget: string
            hint: 'Якорь на главной со решёткой (#otzivy) или адрес страницы (remont-kompyuterov-spb.html). На страницах сборок якоря автоматически ведут на главную'

  - name: codes
    label: Коды и счётчики
    icon: code
    description: Код для сторонних сервисов (Яндекс Метрика, Top.Mail.Ru, чаты). Вставляется на все страницы сайта сразу. После сохранения сайт пересоберётся сам
    file: content/codes.json
    format: json
    fields:
      - name: head_code
        label: Код в <head> (служебная часть страницы)
        widget: code
        output_code_only: true
        required: false
        hint: 'То, что сервис просит вставить «в тег head». Обычно это метатеги и favicon-коды. Оставьте пустым, если ничего не нужно'
      - name: body_code
        label: Код перед </body> (конец страницы)
        widget: code
        output_code_only: true
        required: false
        hint: 'То, что сервис просит вставить «перед закрывающим body». Обычно сюда ставят Яндекс Метрику, Top.Mail.Ru и онлайн-чаты. Оставьте пустым, если ничего не нужно'

collections:
  - name: cards
    label: Последние проекты нашей мастерской
    icon: computer
    description: Компьютеры, которые показываются на главной в блоке «Последние проекты нашей мастерской»
    files:
      - name: cards
        label: Карточки
        file: content/cards.json
        format: json
        fields:
          - name: cards
            label: Карточки
            label_singular: карточку
            widget: list
            min: 1
            add_to_top: false
            summary: '{{name}} — от {{price_from}} ₽'
            hint: 'Порядок в списке = порядок на странице. Кнопками вверх/вниз можно менять карточки местами'
            fields:
              - name: name
                label: Название
                widget: string
                hint: 'Например: NOVA X1'
              - name: image
                label: Фото
                widget: imageFocal
                hint: 'Выбери файл, затем кликни по превью — перекрестие задаёт видимую область. Маленький кадр показывает, что будет на карточке. Значение хранится как {path, x, y}'
              - name: alt
                label: Что на фото
                widget: string
                hint: 'Коротко: «компьютер в чёрном корпусе с деревянной панелью». Нужно поисковикам и незрячим'
              - name: tag
                label: Подпись в углу фото
                widget: string
                required: false
                hint: 'Например: 2k gaming. Оставьте пустым, если подпись не нужна'
              - name: specs
                label: Комплектующие (кратко)
                label_singular: строку
                widget: list
                summary: '{{label}}: {{value}}'
                hint: 'Две-три главные строки: Процессор, Видеокарта…'
                fields:
                  - name: label
                    label: Что
                    widget: string
                  - name: value
                    label: Модель
                    widget: string
              - name: price_from
                label: Цена от, ₽
                widget: number
                value_type: int
                min: 0
                hint: 'Только число, без пробелов: 99800'
              - name: page
                label: Ссылка на страницу сборки
                widget: string
                required: false
                hint: 'Имя файла страницы, например solar-s1-....html. Если пусто, карточка ведёт на блок подбора на главной'
              - name: extra
                label: Скрывать до нажатия «Показать ещё»
                widget: boolean
                required: false
                default: false

  - name: builds
    label: Сборки
    label_singular: сборку
    icon: desktop_windows
    description: Страницы компьютеров. Одна запись — одна страница сайта.
    folder: content/builds
    format: json
    extension: json
    create: true
    identifier_field: name
    slug: '{{fields.slug}}'
    summary: '{{name}} — {{price}} ₽'
    sortable_fields: [name, price]
    editor:
      preview: false
    fields:
      - name: name
        label: Название
        widget: string
        hint: 'Крупный заголовок страницы. Например: SOLAR S1'
      - name: subtitle
        label: Строка под названием
        widget: string
        required: false
        hint: 'Продолжение заголовка, читается поисковиком как одно целое с названием. Например: игровой компьютер на процессоре INTEL CORE i5-12400F и NVIDIA RTX 5050'
      - name: slug
        label: Адрес страницы
        widget: string
        pattern: ['^[a-z0-9][a-z0-9-]*$', 'Только латинские строчные буквы, цифры и дефис']
        hint: 'Часть адреса после star-comp.ru/. Для страниц со старого сайта — точно как было, иначе страница потеряет позиции в поиске. После публикации не менять.'
      - name: price
        label: Цена, ₽
        widget: number
        value_type: int
        min: 0
        hint: 'Только число, без пробелов и знака рубля: 121000'
      - name: note
        label: Текст рядом с кнопкой
        widget: text
        required: false
        hint: 'Два-три коротких предложения: что с компьютером и как его получить'
      - name: photos
        label: Фотографии
        label_singular: фото
        widget: list
        min: 1
        summary: '{{alt}}'
        hint: 'Первое фото — главное: корпус целиком. Лучше горизонтальные 4:3, остальное сайт обрежет по центру.'
        fields:
          - name: image
            label: Фото
            widget: image
          - name: alt
            label: Что на фото
            widget: string
            hint: 'Коротко, без названия сборки: «видеокарта крупным планом». Нужно поисковикам и незрячим.'
      - name: video
        label: Видео (Kinescope)
        widget: object
        required: false
        collapsed: true
        hint: 'Если видео нет — оставьте пустым, блок на странице не появится'
        fields:
          - name: horizontal
            label: Код горизонтального видео
            widget: string
            required: false
            hint: 'Буквы и цифры из ссылки kinescope.io/… — показывается на компьютере'
          - name: vertical
            label: Код вертикального видео
            widget: string
            required: false
            hint: 'Показывается на телефоне. Если его нет, будет горизонтальное'
          - name: cover_h
            label: Обложка горизонтальная (16:9)
            widget: image
            required: false
          - name: cover_v
            label: Обложка вертикальная (9:16)
            widget: image
            required: false
      - name: lead
        label: Описание сборки
        widget: text
        required: false
        hint: 'Одно-три предложения: для чего этот компьютер. Стоит под заголовком «Конфигурация»'
      - name: about
        label: Текст о сборке
        widget: text
        required: false
        hint: 'Абзац после описания сборки: на каких настройках идёт, кому подойдёт. Разворачивается на всю ширину'
      - name: specs
        label: Комплектующие
        label_singular: строку
        widget: list
        summary: '{{label}}: {{value}}'
        fields:
          - name: label
            label: Что
            widget: string
            hint: 'Процессор, Видеокарта, Корпус…'
          - name: value
            label: Модель
            widget: string
      - name: seo
        label: Для поисковиков
        widget: object
        required: false
        collapsed: true
        fields:
          - name: title
            label: Title — название вкладки и заголовок в поиске
            widget: string
            required: false
            hint: 'До 70 знаков. Если пусто — соберётся из названия и строки под ним'
          - name: description
            label: Description — описание в поиске
            widget: text
            required: false
            hint: '150–200 знаков: комплектующие, цена, город, чем удобно'
